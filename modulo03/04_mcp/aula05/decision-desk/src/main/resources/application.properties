# ─── Modelo grande / DEFAULT (Ollama Cloud) ──────────────────────────────────
# deepseek-v4-pro:cloud raciocina e usa tools: é o cérebro do AgenteEcossistema,
# que redige a recomendação fundamentada (o mini-ADR).
quarkus.langchain4j.ollama.chat-model.model-id=deepseek-v4-pro:cloud
quarkus.langchain4j.ollama.chat-model.temperature=0.2
# Teto folgado de tokens: o modelo "pensa" antes de responder; sem folga, o orçamento
# pode acabar no raciocínio e a resposta final vir vazia.
quarkus.langchain4j.ollama.chat-model.num-predict=8192
quarkus.langchain4j.timeout=180s

# ─── Modelo "smaller" (Ollama Cloud) ─────────────────────────────────────────
# Modelos menores para as tarefas braçais: ler o repositório (AgenteRepo), gravar o
# ADR (EscritorAdr) e gerar perguntas de exemplo. Referenciado por @RegisterAiService(modelName="smaller").
quarkus.langchain4j.ollama.smaller.chat-model.model-id=gemma4:31b-cloud
quarkus.langchain4j.ollama.smaller.chat-model.temperature=0.3

# Usamos o Ollama já instalado (localhost:11434 / Ollama Cloud); sem dev services e sem preload.
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.preload=false

# Log de cada request/response ao modelo. É no log que a aula acontece: compare a lista de
# tools do request de cada agente (AgenteRepo enxerga o filesystem; AgenteEcossistema, só o DeepWiki).
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# ─── Configuração própria do projeto ─────────────────────────────────────────
# Diretório que o server MCP de filesystem pode enxergar (leitura e escrita do ADR).
# ${user.dir} = a pasta onde você rodou o projeto. Aponte para um repositório seu e
# faça uma pergunta sobre o seu código de verdade.
desk.repo.diretorio=${user.dir}

# Quanto tempo o gate humano espera pelo "sim/não" antes de negar por segurança.
desk.aprovacao.timeout.minutos=10

# ─── MCP declarativo (a novidade vs. a aula03, que montava tudo na mão) ──────
# Uma caixa por agente. Aqui só registramos os servers; quem recebe cada caixa é o
# @McpToolBox de cada agente. Granularidade da seleção = o server inteiro (todas as tools dele).

# Caixa "filesystem" → AgenteRepo (lê) e EscritorAdr (grava). Server de referência subido
# via npx, com transporte stdio, enxergando apenas o diretório autorizado acima.
quarkus.langchain4j.mcp.filesystem.transport-type=stdio
quarkus.langchain4j.mcp.filesystem.command=npx,-y,@modelcontextprotocol/server-filesystem,${desk.repo.diretorio}

# Caixa "deepwiki" → AgenteEcossistema (confronta com a doc do ecossistema). Server remoto,
# transporte streamable-http, sem auth. Alternativa igualmente sem auth: https://mcp.context7.com/mcp
quarkus.langchain4j.mcp.deepwiki.transport-type=streamable-http
quarkus.langchain4j.mcp.deepwiki.url=https://mcp.deepwiki.com/mcp

# O client MCP faz um ping periódico para saber se o server remoto ainda responde; o default
# é 60s, exatamente o tempo que o DeepWiki leva para fechar uma conexão ociosa (GOAWAY). Os dois
# relógios disputam a mesma conexão e o ping às vezes pega uma conexão recém-fechada
# (HttpClosedException). Pingando a cada 30s a conexão nunca fica ociosa o bastante para cair:
# some o WARN e, mais importante, a conexão fica quente para as chamadas de tool de verdade.
quarkus.langchain4j.mcp.deepwiki.auto-health-check-interval=30s
