<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Copilot · MCP declarativo</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 820px; margin: 0 auto; padding: 24px; line-height: 1.5;
        }
        h1 { font-size: 1.4rem; margin-bottom: 4px; }
        p.sub { margin-top: 0; opacity: 0.7; font-size: 0.9rem; }
        .exemplos { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }
        .exemplos button {
            font-size: 0.8rem; padding: 6px 10px; border-radius: 999px;
            border: 1px solid currentColor; background: transparent; cursor: pointer; opacity: 0.85;
        }
        #chat { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .msg { padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #2563eb; color: #fff; max-width: 80%; }
        .bot { align-self: flex-start; background: rgba(127,127,127,0.15); max-width: 90%; }
        .bot.pensando { opacity: 0.6; font-style: italic; }
        form { display: flex; gap: 8px; position: sticky; bottom: 0; padding: 12px 0;
               background: Canvas; }
        input {
            flex: 1; padding: 12px 14px; border-radius: 10px;
            border: 1px solid rgba(127,127,127,0.4); font-size: 1rem; background: Canvas; color: CanvasText;
        }
        button[type=submit] {
            padding: 12px 20px; border-radius: 10px; border: none;
            background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🤖 Repo Copilot · MCP declarativo</h1>
    <p class="sub">O mesmo assistente da aula anterior (filesystem via stdio + DeepWiki via
        Streamable HTTP), mas agora com a montagem do MCP 100% declarativa:
        <code>application.properties</code> + <code>@McpToolBox</code>, sem nenhuma classe para ligar as peças.</p>

    <div class="exemplos">
        <button onclick="usar(this)">Quais arquivos existem neste projeto e o que faz o README?</button>
        <button onclick="usar(this)">Liste os arquivos .java e explique o papel de cada um.</button>
        <button onclick="usar(this)">No repositório quarkusio/quarkus, o que é o Quarkus?</button>
    </div>

    <div id="chat"></div>

    <form id="form">
        <input id="pergunta" autocomplete="off" placeholder="Pergunte sobre o projeto ou um repositório do GitHub..." required>
        <button type="submit" id="enviar">Enviar</button>
    </form>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('pergunta');
        const enviar = document.getElementById('enviar');

        function usar(botao) { input.value = botao.textContent; input.focus(); }

        function bolha(texto, classe) {
            const div = document.createElement('div');
            div.className = 'msg ' + classe;
            div.textContent = texto;
            chat.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
            return div;
        }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pergunta = input.value.trim();
            if (!pergunta) return;

            bolha(pergunta, 'user');
            input.value = '';
            enviar.disabled = true;
            const pensando = bolha('consultando os servidores MCP...', 'bot pensando');

            try {
                const resp = await fetch('/api/assistente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta })
                });
                const dados = await resp.json();
                pensando.remove();
                bolha(dados.resposta || '(resposta vazia)', 'bot');
            } catch (err) {
                pensando.remove();
                bolha('Erro ao falar com o assistente: ' + err.message, 'bot');
            } finally {
                enviar.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
