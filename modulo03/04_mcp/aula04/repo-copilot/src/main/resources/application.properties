# ─── Modelo (Ollama Cloud) ────────────────────────────────────────────────────
# Modelo com raciocínio (thinking) e suporte a tools: precisa das duas coisas
# para orquestrar as chamadas de tool MCP.
quarkus.langchain4j.ollama.chat-model.model-id=deepseek-v4-pro:cloud
quarkus.langchain4j.ollama.chat-model.temperature=0.2
# Teto folgado de tokens: o modelo "pensa" antes de responder; sem folga, o orçamento
# pode acabar no raciocínio e a resposta final vir vazia.
quarkus.langchain4j.ollama.chat-model.num-predict=8192
quarkus.langchain4j.timeout=180s

# Usamos o Ollama já instalado (localhost:11434 / Ollama Cloud); sem dev services.
quarkus.langchain4j.ollama.devservices.enabled=false

# Log de cada request/response ao modelo: é aqui que você vê as chamadas de tool MCP
# (o modelo pedindo list_directory / read_file / ask_question e recebendo o resultado).
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# ─── MCP declarativo (o coração da aula) ──────────────────────────────────────
# Na aula03, este bloco não existia: cada client MCP era montado à mão em código
# (McpClients.java criava transporte + DefaultMcpClient; ProjetoToolProviderSupplier
# adaptava tudo num McpToolProvider). Aqui a extensão faz esse trabalho a partir da
# configuração. Cada "nome" abaixo (filesystem, deepwiki, protegido) vira um client MCP
# gerenciado pelo Quarkus, com ciclo de vida (abre no boot, fecha no shutdown) por conta
# da extensão: o que na aula03 eram nossos @PostConstruct/@PreDestroy.

# --- Client "filesystem" (local, processo filho) ---
# transport-type=stdio + command era, na aula03, o StdioMcpTransport.Builder().command(...).
# O Quarkus sobe o servidor de filesystem como processo filho (npx) e conversa por stdin/stdout.
quarkus.langchain4j.mcp.filesystem.transport-type=stdio
quarkus.langchain4j.mcp.filesystem.command=npx,-y,@modelcontextprotocol/server-filesystem,${assistente.projeto.diretorio}
quarkus.langchain4j.mcp.filesystem.log-requests=true
quarkus.langchain4j.mcp.filesystem.log-responses=true
quarkus.langchain4j.mcp.filesystem.tool-execution-timeout=60s
# Cada chamada de tool deste client vira métrica Micrometer em /q/metrics.
quarkus.langchain4j.mcp.filesystem.metrics.enabled=true

# --- Client "deepwiki" (remoto, Streamable HTTP, sem auth) ---
# transport-type=streamable-http + url era, na aula03, o StreamableHttpMcpTransport.Builder().url(...).
# DeepWiki responde sobre repositórios públicos do GitHub.
quarkus.langchain4j.mcp.deepwiki.transport-type=streamable-http
quarkus.langchain4j.mcp.deepwiki.url=https://mcp.deepwiki.com/mcp
quarkus.langchain4j.mcp.deepwiki.log-requests=true
quarkus.langchain4j.mcp.deepwiki.log-responses=true
quarkus.langchain4j.mcp.deepwiki.tool-execution-timeout=60s
# Não fazer ping recorrente num serviço público gratuito de terceiros: desligamos o
# health check automático (o de fundo). O health sob demanda em /q/health continua
# funcionando; só não ficamos batendo no DeepWiki sozinhos o tempo todo.
quarkus.langchain4j.mcp.deepwiki.auto-health-check=false
quarkus.langchain4j.mcp.deepwiki.metrics.enabled=true

# --- Client "protegido" (remoto, desligado) ---
# Existe só para demonstrar o par com o TokenAuthProvider (ver TokenAuthProvider.java):
# um client que fala com um server MCP protegido por token. Está enabled=false: o
# circuito completo só fecha quando construirmos o nosso próprio server, mais adiante no
# bloco. enabled=false é o interruptor declarativo que, na aula03, era o try/catch no boot:
# em vez de "tenta abrir e, se falhar, segue sem", aqui simplesmente não abrimos.
quarkus.langchain4j.mcp.protegido.transport-type=streamable-http
quarkus.langchain4j.mcp.protegido.url=https://mcp.interno.exemplo/mcp
quarkus.langchain4j.mcp.protegido.enabled=false

# ─── Configuração própria do projeto ──────────────────────────────────────────
# Diretório que o servidor MCP de filesystem pode enxergar. ${user.dir} = a pasta onde
# você rodou o projeto (ele mesmo). Troque para um projeto/repositório seu.
assistente.projeto.diretorio=${user.dir}

# Token usado pelo TokenAuthProvider para se apresentar ao client "protegido". É lido por
# interpolação da variável de ambiente MCP_TOKEN. O default vazio ( :} ) existe porque essa
# variável normalmente não está definida na máquina do aluno. No provider a injeção é
# Optional<String> justamente por conta disso: o SmallRye Config trata string vazia como
# ausência de valor, então uma injeção como String obrigatório receberia null e a aplicação
# não subiria. Nunca hardcode nem commite o valor real do token.
assistente.mcp.token=${MCP_TOKEN:}

# ─── Observabilidade / Langfuse ───────────────────────────────────────────────
# Em dev, os Dev Services do quarkus-langfuse sobem o stack completo do Langfuse
# (web, worker, PostgreSQL, ClickHouse, Redis, MinIO): é pesado, exige Docker/Podman
# e o primeiro boot demora (baixando imagens). Por padrão o filtro de spans é "ai-only"
# (só os spans de IA vão para o Langfuse).
#
# Este projeto não tem um collector OTLP (Jaeger ou similar) escutando, então o exporter
# padrão de traces do Quarkus só ficaria tentando alcançar localhost:4317 e enchendo o log
# de warnings de conexão recusada. Desligamos esse exporter. Os traces de IA continuam indo
# para o Langfuse, que usa um span processor próprio, registrado à parte deste exporter.
# Quem tiver um collector OTLP de verdade rodando pode remover a linha abaixo.
quarkus.otel.traces.exporter=none
#
# Fallback: se a máquina não aguentar o stack, descomente a linha abaixo. O restante do
# projeto (agente, MCP, health, métricas, traces OTel) roda normalmente sem o Langfuse.
# quarkus.langfuse.devservices.enabled=false
#
# Produção: você aponta para um Langfuse real (self-hosted ou cloud) e
# fornece as chaves (nunca comitadas). Descomente e preencha via variáveis de ambiente:
# quarkus.langfuse.base-url=${LANGFUSE_BASE_URL}
# quarkus.langfuse.username=${LANGFUSE_PUBLIC_KEY}
# quarkus.langfuse.password=${LANGFUSE_SECRET_KEY}
