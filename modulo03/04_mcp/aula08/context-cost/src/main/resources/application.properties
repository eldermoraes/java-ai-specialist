# ═══════════════════════════════════════════════════════════════════════════════
#  Aula 08 (MCP): Context Cost
#  Um agente propositalmente superequipado, para a conta de contexto aparecer no log.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Modelo (Ollama Cloud) ────────────────────────────────────────────────────
# Modelo com raciocínio (thinking) e suporte a tools: precisa das duas coisas para
# orquestrar as chamadas de tool MCP dos três servidores plugados.
quarkus.langchain4j.ollama.chat-model.model-id=deepseek-v4-pro:cloud
quarkus.langchain4j.ollama.chat-model.temperature=0.2
# Teto folgado de tokens: o modelo "pensa" antes de responder; sem folga, o orçamento
# pode acabar no raciocínio e a resposta final vir vazia.
quarkus.langchain4j.ollama.chat-model.num-predict=8192
# Timeout generoso: com três servidores e arquivos grandes, um ciclo de tool calls
# pode demorar.
quarkus.langchain4j.timeout=180s

# Alternativa mais econômica (menos tokens de raciocínio, resposta mais direta):
# quarkus.langchain4j.ollama.chat-model.model-id=gpt-oss:20b-cloud

# Usamos o Ollama já instalado (localhost:11434 / Ollama Cloud); sem dev services.
quarkus.langchain4j.ollama.devservices.enabled=false

# Log de cada request/response ao modelo. É aqui que a conta aparece: no request de
# uma pergunta trivial você verá todas as definições de tools dos três servidores
# empacotadas junto; no cenário B, verá o conteúdo do arquivo passar duas vezes.
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# ─── Montagem MCP declarativa (o contraste com a aula 03) ─────────────────────
# Na aula 03 você montou tudo à mão, em código (StdioMcpTransport, DefaultMcpClient,
# McpToolProvider peça por peça). Aqui não há uma linha de código Java ligando as
# peças: os três clientes MCP nascem só destas chaves `quarkus.langchain4j.mcp.<nome>.*`.
# É a montagem declarativa apresentada na aula 04, reaproveitada: o foco desta aula é
# quanto custa estar conectado, não como conectar.
#
# Cada bean de cliente pode ser injetado por CDI com o qualifier @McpClientName("<nome>")
# (é assim que o MedidorDeContexto pega cada um para contar as tools no boot).

# Cliente 1: filesystem local, transporte STDIO (processo filho via npx).
# O diretório autorizado é src/main/resources/dados (rodando da raiz do projeto,
# ${user.dir} = a raiz). É onde estão relatorio-grande.md, notas.md e resumo-vendas.md.
quarkus.langchain4j.mcp.filesystem.transport-type=stdio
quarkus.langchain4j.mcp.filesystem.command=npx,-y,@modelcontextprotocol/server-filesystem,${user.dir}/src/main/resources/dados

# Cliente 2: DeepWiki, remoto, transporte Streamable HTTP (servidor público, sem auth).
quarkus.langchain4j.mcp.deepwiki.transport-type=streamable-http
quarkus.langchain4j.mcp.deepwiki.url=https://mcp.deepwiki.com/mcp

# Cliente 3: Context7, remoto, transporte Streamable HTTP (servidor público, sem auth).
quarkus.langchain4j.mcp.context7.transport-type=streamable-http
quarkus.langchain4j.mcp.context7.url=https://mcp.context7.com/mcp

# Log por cliente MCP. Estas chaves existem na extensão e, por padrão, já herdam o
# valor global de quarkus.langchain4j.log-requests/log-responses acima; deixamos
# explícito aqui só para você saber que o controle é granular, servidor a servidor.
quarkus.langchain4j.mcp.filesystem.log-requests=true
quarkus.langchain4j.mcp.filesystem.log-responses=true
quarkus.langchain4j.mcp.deepwiki.log-requests=true
quarkus.langchain4j.mcp.deepwiki.log-responses=true
quarkus.langchain4j.mcp.context7.log-requests=true
quarkus.langchain4j.mcp.context7.log-responses=true

# Health check dos clientes MCP desligado. Dois servidores são remotos e públicos;
# se um deles estiver fora do ar, isso não pode derrubar o readiness da aplicação.
# (Nome real da chave conferido na extensão: `...mcp.health.enabled`.)
quarkus.langchain4j.mcp.health.enabled=false

# ─── Flag do medidor de contexto ──────────────────────────────────────────────
# O MedidorDeContexto imprime, no boot, a tabela de custo por servidor. Ele só roda
# se esta flag estiver ligada, e ela fica desligada em teste, porque a contagem
# exige conectar de fato aos servidores (npx + rede), e o teste tem de passar offline.
medidor.contexto.enabled=true
%test.medidor.contexto.enabled=false

# Em teste, além de não rodar o medidor, desligamos os três clientes MCP para o boot
# não tentar subir npx nem falar com a internet. O smoke test só verifica a montagem
# do AI service (injeção do bean), sem chamar modelo nem tools.
%test.quarkus.langchain4j.mcp.filesystem.enabled=false
%test.quarkus.langchain4j.mcp.deepwiki.enabled=false
%test.quarkus.langchain4j.mcp.context7.enabled=false

# Porta aleatória nos testes: evita conflito com a porta 8081 quando há outros
# dev modes/apps rodando na mesma máquina (cenário comum durante as gravações).
%test.quarkus.http.test-port=0
