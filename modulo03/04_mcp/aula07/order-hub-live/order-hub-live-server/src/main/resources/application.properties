# ═══════════════════════════════════════════════════════════════════════════════
# order-hub-live-server: a Central de Pedidos da Cloud For You no mundo (MCP server)
#
# ┌─ O que você NÃO vê aqui ────────────────────────────────────────────────────┐
# │ Procure uma chave de modelo: Ollama, OpenAI, qualquer LLM. Não tem, e não é │
# │ esquecimento: o server não tem LLM. Quem raciocina é o agente do lado       │
# │ client; o server só expõe capacidades. Por isso ele é barato: serviço HTTP  │
# │ comum, sem inferência, sem GPU, sem token.                                  │
# └─────────────────────────────────────────────────────────────────────────────┘
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Traffic logging da extensão de MCP server ─────────────────────────────────
# É aqui que você "vê" o protocolo do lado de quem responde: o JSON-RPC cru
# trafegando (initialize, tools/list, tools/call, elicitation/create). É o espelho
# invertido do log que você lia como client: lá saía o request, aqui ele chega.
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=1000

# ─── Testes: porta aleatória ───────────────────────────────────────────────────
# Nos @QuarkusTest, use uma porta livre qualquer (0 = o sistema escolhe) em vez da
# 8081 padrão, assim os testes não colidem com nada que esteja rodando na máquina.
%test.quarkus.http.test-port=0

# ─── Perfil default: sem fechadura ─────────────────────────────────────────────
# No dev/test do dia a dia o server roda aberto, para você focar nas tools. A
# fechadura entra só com -Dquarkus.profile=seguro: no default deixamos OIDC e os
# Keycloak Dev Services desligados, então nada de container sobe sem você pedir.
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false

# ═══════════════════════════════════════════════════════════════════════════════
# Perfil %seguro, a aula 7: proteger o server (rode com -Dquarkus.profile=seguro)
#
# Aqui o server vira um OAuth 2.1 Resource Server: ele não emite token nenhum,
# só valida o Bearer que chega no /mcp. Os Keycloak Dev Services sobem um Keycloak
# em container automaticamente (com realm e client prontos), então o aluno vê a
# fechadura funcionando sem montar infraestrutura à mão.
# ═══════════════════════════════════════════════════════════════════════════════

# Liga o OIDC e o Keycloak em container só neste perfil.
%seguro.quarkus.oidc.tenant-enabled=true
%seguro.quarkus.keycloak.devservices.enabled=true

# Exige autenticação no endpoint MCP: quem não apresentar um Bearer válido leva 401.
# (Listamos /mcp e /mcp/* para cobrir tanto o path exato quanto os subcaminhos.)
%seguro.quarkus.http.auth.permission.mcp-endpoints.paths=/mcp,/mcp/*
%seguro.quarkus.http.auth.permission.mcp-endpoints.policy=authenticated

# RFC 9728 (Protected Resource Metadata) = o "cartaz na porta": o server publica
# metadados dizendo quem o protege, para o client saber onde ir buscar um token.
%seguro.quarkus.oidc.resource-metadata.enabled=true

# RFC 8707 (Resource Indicators) = o "token com destinatário": amarra o token ao
# server de destino, para um token emitido para cá não ser reusado em outro lugar.
# Deixada comentada de propósito: com os Keycloak Dev Services, o
# audience padrão emitido pelo Keycloak provisionado pode não bater com este valor,
# derrubando toda chamada com 401. Ative e ajuste o audience ao seu authorization
# server real antes de exigir essa validação.
# %seguro.quarkus.oidc.token.audience=order-hub-live-server
