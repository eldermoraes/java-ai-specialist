# ═══════════════════════════════════════════════════════════════════════════════
# order-hub-client: o agente que consome a Central de Pedidos (MCP client)
#
# Ao contrário do server, este projeto tem LLM: é o agente que raciocina e decide
# chamar as tools. Ele fecha o loop: consome o seu próprio server pelo mesmo
# caminho declarativo com que consumiria o de qualquer um.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Porta HTTP ────────────────────────────────────────────────────────────────
# O order-hub-server ocupa a 8080; o client sobe na 8081 para os dois rodarem lado
# a lado na sua máquina (server num terminal, client em outro).
quarkus.http.port=8081

# Nos @QuarkusTest, porta livre qualquer (0 = o sistema escolhe), para os testes não
# colidirem com o que estiver rodando na máquina.
%test.quarkus.http.test-port=0

# ─── Modelo (Ollama Cloud): o modelo grande, padrão ────────────────────────────
# Precisa de raciocínio (thinking) e suporte a tools para orquestrar as chamadas MCP.
quarkus.langchain4j.ollama.chat-model.model-id=deepseek-v4-pro:cloud
quarkus.langchain4j.ollama.chat-model.temperature=0.2
# Teto folgado de tokens: o modelo "pensa" antes de responder; sem folga, o orçamento
# pode acabar no raciocínio e a resposta final vir vazia.
quarkus.langchain4j.ollama.chat-model.num-predict=8192
quarkus.langchain4j.timeout=180s

# Usamos o Ollama já instalado (localhost:11434 / Ollama Cloud); sem dev services.
quarkus.langchain4j.ollama.devservices.enabled=false

# ─── Modelo nomeado "smaller": o modelo pequeno (padrão do curso) ──────────────
# Fica configurado como um segundo modelo nomeado, à disposição para tarefas mais
# baratas. Para usá-lo num @RegisterAiService, aponte modelName="smaller".
quarkus.langchain4j.ollama.smaller.chat-model.model-id=gpt-oss:20b-cloud
quarkus.langchain4j.ollama.smaller.chat-model.temperature=0.2
quarkus.langchain4j.ollama.smaller.chat-model.num-predict=8192

# ─── Log de cada request/response ao modelo ────────────────────────────────────
# É aqui que você vê o modelo pedindo as tools MCP (buscar_pedido, cancelar_pedido...)
# e recebendo o resultado: o ciclo de tool-calling acontecendo.
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# ─── Client MCP declarativo: a Central de Pedidos ──────────────────────────────
# Duas linhas e o agente ganha as tools do server. O transporte é Streamable HTTP
# (o atual do MCP), apontando para o /mcp do order-hub-server na 8080.
quarkus.langchain4j.mcp.central-pedidos.transport-type=streamable-http
quarkus.langchain4j.mcp.central-pedidos.url=http://localhost:8080/mcp

# Não deixe o boot do client depender do server estar de pé: sem health check, o
# client sobe mesmo com o server fora do ar (e só falha na hora de usar a tool).
quarkus.langchain4j.mcp.health.enabled=false
