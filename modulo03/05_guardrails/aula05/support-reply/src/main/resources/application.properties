# ─── Modelo (Ollama Cloud) ───────────────────────────────────────────────────
# O modelo grande é o assistente de suporte: responde ao cliente seguindo a política
# da loja. Cada resposta dele passa pela fila de saída antes de chegar ao cliente.
quarkus.langchain4j.ollama.chat-model.model-id=deepseek-v4-pro:cloud
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.timeout=180s

# Rodando com Ollama local, troque a linha acima por um modelo que você tenha baixado:
# quarkus.langchain4j.ollama.chat-model.model-id=qwen3:4b

# ─── Modelo "juiz": o LLM as judge ───────────────────────────────────────────
# O primeiro guardrail de saída pergunta a um modelo se a resposta respeita a política.
# Não precisa ser o grande: o critério é estreito, a referência (a política) vai no
# prompt e o veredito é binário. Outra família de modelo, para não repetir o viés do
# modelo avaliado. O token gasto aqui é o token do guardrail, em toda resposta e em
# cada tentativa de reprompt.
# Selecionado com @RegisterAiService(modelName = "juiz").
quarkus.langchain4j.ollama.juiz.chat-model.model-id=gemma4:31b-cloud
# Temperatura zero: o mesmo veredito para a mesma resposta, na medida do possível.
quarkus.langchain4j.ollama.juiz.chat-model.temperature=0
quarkus.langchain4j.ollama.juiz.timeout=60s

# Usamos o Ollama já instalado (localhost:11434 / Ollama Cloud); sem dev services.
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.preload=false

# ─── Limite de tentativas ────────────────────────────────────────────────────
# Quantas vezes a chamada ao modelo pode acontecer numa mesma requisição quando o juiz
# pede reprompt. Dois é a chamada original mais uma tentativa: as requisições 3 e 4 do
# README gastam as duas. Zero desliga a tentativa extra: a primeira reprovação já vira
# exceção, e a aplicação dá o fallback. A quinta requisição troca este valor por 0 com
# o dev mode no ar.
quarkus.langchain4j.guardrails.max-retries=2

# ─── Regra de link: o domínio da loja ────────────────────────────────────────
# O segundo guardrail de saída reescreve todo link que não seja deste domínio (ou de
# um subdomínio dele). É regra de código: sem token, e sempre a mesma decisão.
support-reply.loja.dominio=lojaexemplo.com.br

# ─── Log ─────────────────────────────────────────────────────────────────────
# Cada guardrail registra a decisão que tomou e o motivo. Parte do seu estudo é ler
# esse log: é ali que se vê o veredito e o motivo do juiz em cada tentativa.
quarkus.log.category."com.eldermoraes.guardrails".level=DEBUG

# Log de cada request/response aos modelos. Em cada requisição aparecem duas chamadas
# por tentativa: a do assistente (a resposta) e a do juiz (o veredito). É no request
# da segunda chamada ao assistente que se vê o motivo do juiz dentro da conversa.
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true
